{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="card small-card">

    <h1>
        Login
    </h1>


    <form
        action="/login"
        method="POST"
    >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p class="center">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>

</div>

{% endblock %}
