<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        AI Job Preparation Assistant
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="nav-title">
        🤖 AI Job Preparation Assistant
    </div>


    {% if session.get("user_id") %}

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/plan">
            AI Plan
        </a>

        <a href="/interview">
            Interview
        </a>

        <a href="/projects">
            Projects
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<main>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
