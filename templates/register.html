{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="card small-card">

    <h1>
        Create Account
    </h1>


    <form
        action="/register"
        method="POST"
    >

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <p class="center">
        Already have an account?
        <a href="/login">
            Login
        </a>
    </p>

</div>

{% endblock %}
